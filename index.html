<style>
/* Layout: the whole screen is the book (page-flip does the paper bend). Apple-style: system type, hairlines, frosted controls. Pages scale through --em. */
:root{
  --desk:linear-gradient(135deg,#ffe3ee,#eadcff 50%,#d6ebff);
  --ink:#1d1d1f; --muted:#6e6e73; --faint:#b0b0b6; --line:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12);
  --glass:rgba(255,255,255,.62); --sheet:rgba(250,250,252,.94); --blue:#007aff;
  --pg-s:60%; --pg-l:98.5%;
  --acc-s:78%; --acc-l:60%; --accd-s:70%; --accd-l:40%; --soft-s:85%; --soft-l:88%;
  --tab-l:84%; --tab-ink-l:30%;
  --f-title:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --desk:linear-gradient(180deg,#1c1c1e,#000); --ink:#f5f5f7; --muted:#98989f; --faint:#636366; --line:rgba(235,235,245,.18); --fill:rgba(120,120,128,.28);
  --glass:rgba(44,44,46,.72); --sheet:rgba(40,40,42,.95); --blue:#0a84ff;
  --pg-s:10%; --pg-l:16%; --acc-l:64%; --accd-s:80%; --accd-l:72%; --soft-s:22%; --soft-l:24%; --tab-l:30%; --tab-ink-l:86%; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(0,122,255,.55);outline-offset:2px}
.stage{position:relative;width:100%;height:100%}
.scene{position:absolute;inset:0}
.book{width:100%;height:100%;font-size:var(--em,16px);transition:transform 1.5s cubic-bezier(.45,.05,.25,1)}
.book.drawing{touch-action:none;cursor:crosshair}
.book.drawing .pg *{pointer-events:none}
/* pages */
.page{overflow:hidden;font-size:var(--em,16px);
  --acc:hsl(var(--h,335) var(--acc-s) var(--acc-l));--acc-soft:hsl(var(--h,335) var(--soft-s) var(--soft-l));--accd:hsl(var(--h,335) var(--accd-s) var(--accd-l));
  background-color:hsl(30 var(--pg-s) var(--pg-l))}
.page::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:4}
.page.pl::before{background:linear-gradient(to left,rgba(0,0,0,.13),transparent 8%)}
.page.pr::before{background:linear-gradient(to right,rgba(0,0,0,.13),transparent 8%)}
.pg{position:absolute;inset:0;padding:2.6em 2.3em 2em;display:flex;flex-direction:column;gap:.9em;min-height:0}
.ink{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.ttl{font-family:var(--f-title);font-weight:700;color:var(--ink);font-size:2em;letter-spacing:-.015em;margin:0;line-height:1.15}
.lbl{font-weight:600;font-size:.7em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hint{font-size:.9em;color:var(--muted);margin-top:-.5em}
/* covers */
.page.cover{background:linear-gradient(155deg,#ffc2da 0%,#dcc8ff 52%,#bfdcff 100%);color:#2c2c2e}
.page.cover.pr::before{background:linear-gradient(to right,rgba(0,0,0,.16),rgba(255,255,255,.4) 2.5%,transparent 7%)}
.page.cover.pl::before{background:linear-gradient(to left,rgba(0,0,0,.16),rgba(255,255,255,.4) 2.5%,transparent 7%)}
.cv{justify-content:space-between;align-items:flex-start;padding:3em 2.6em}
.cv-top{font-size:.78em;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:rgba(44,44,46,.62)}
.cv-year{font-family:var(--f-title);font-size:6.4em;font-weight:700;letter-spacing:-.04em;line-height:.9;color:#2c2c2e}
.cv-tip{font-size:.85em;color:rgba(44,44,46,.6)}
/* inside pages */
.field{display:flex;flex-direction:column;gap:.35em}
.field input[type=text]{border:0;border-bottom:1px solid var(--line);background:transparent;font-family:var(--f-title);font-size:1.5em;padding:.2em 0;min-width:0}
.field input::placeholder{color:var(--faint)}
.stepper{display:flex;align-items:center;gap:.8em}
.stepper b{font-family:var(--f-title);font-weight:700;font-size:1.5em;min-width:2.6em;text-align:center}
.stepper button{width:2.2em;height:2.2em;border-radius:50%;border:0;background:var(--fill);font-weight:600;color:var(--accd)}
.cl{display:flex;flex-direction:column;gap:.5em;min-height:0}
.cl-add{display:flex;gap:.5em;align-items:center}
.cl-add input{flex:1;min-width:0;border:0;background:var(--fill);border-radius:.8em;padding:.6em .9em;font-size:.95em}
.cl-add input::placeholder{color:var(--muted)}
.cl-plus{border:0;background:var(--acc);color:#fff;width:2.1em;height:2.1em;border-radius:50%;font-size:1.1em;font-weight:500;line-height:1;flex:none}
.cl-list{list-style:none;margin:0;padding:0;overflow:auto;min-height:0}
.cl-list li{display:flex;align-items:center;gap:.7em;padding:.6em 0;border-bottom:1px solid var(--line)}
.ck{width:1.5em;height:1.5em;border-radius:50%;border:1.5px solid var(--faint);background:transparent;padding:0;flex:none;display:grid;place-items:center}
.ck svg{width:.9em;height:.9em;stroke:#fff;opacity:0}
li.done .ck{background:var(--acc);border-color:var(--acc)}li.done .ck svg{opacity:1}
.tx{flex:1;min-width:0;overflow-wrap:anywhere;font-size:1.02em;line-height:1.3}
li.done .tx{color:var(--muted)}
.rm{border:0;background:none;color:var(--faint);font-size:1.3em;line-height:1;padding:0 .2em}
.rm:hover{color:var(--ink)}
.cl-list li a.cal{text-decoration:none;line-height:1;font-size:1.05em}
.lined{flex:1;min-height:4em;width:100%;resize:none;border:0;background-color:transparent;font-size:1.02em;line-height:2em;padding:0;
  background-image:repeating-linear-gradient(transparent 0 calc(2em - 1px),var(--line) calc(2em - 1px) 2em);background-attachment:local;overflow:auto}
.lined::placeholder{color:var(--faint)}
/* month calendar */
.cal-top{display:flex;align-items:baseline;gap:.5em;padding-bottom:.5em;border-bottom:.14em solid var(--acc)}
.cal-top .ttl{font-size:2.3em}
.cal-top .yr{font-family:var(--f-title);font-size:1.5em;font-weight:400;color:var(--accd)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:600;font-size:.66em;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.cal-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:.7em;overflow:hidden}
.dc{position:relative;border:0;border-radius:0;background:hsl(30 var(--pg-s) var(--pg-l));padding:.35em .3em .25em;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0;min-height:0;font-family:var(--f-body)}
.dc.blank{background:hsl(30 var(--pg-s) calc(var(--pg-l) - 2.5%));pointer-events:none}
.dc:hover{background:var(--acc-soft)}
.dn{font-size:.78em;font-weight:500;align-self:flex-start;line-height:1;min-width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:50%}
.ds{font-size:1.15em;line-height:1}
.dots{display:flex;gap:.18em;height:.4em;align-items:center}
.dots i{width:.38em;height:.38em;border-radius:50%;border:1px solid var(--acc)}
.dots i.on{background:var(--acc)}
.dc.today .dn{background:var(--acc);color:#fff;font-weight:700}
.foot-note{text-align:center;font-size:.8em;color:var(--muted);margin-top:0}
.up{display:flex;flex-direction:column;gap:.35em;min-height:0}
.up-row{display:flex;gap:.7em;align-items:center;font-size:.95em;line-height:1.2}
.up-row b{font-size:.78em;font-weight:600;background:var(--acc);color:#fff;border-radius:2em;padding:.15em .6em;flex:none;min-width:2.2em;text-align:center}
.up-row span{min-width:0;overflow-wrap:anywhere}
/* year glance */
.yg{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:.2em .8em;flex:1;min-height:0;align-content:stretch}
.mini{border:0;background:transparent;padding:.3em;border-radius:.8em;text-align:left;display:flex;flex-direction:column;gap:.25em;min-width:0;
  --acc:hsl(var(--mh) var(--acc-s) var(--acc-l));--acc-soft:hsl(var(--mh) var(--soft-s) var(--soft-l));--accd:hsl(var(--mh) var(--accd-s) var(--accd-l))}
.mini:hover{background:var(--acc-soft)}
.mini h4{margin:0;font-weight:700;font-size:.85em;color:var(--accd)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:.05em;font-size:.5em;font-weight:500;text-align:center;line-height:1.35;color:var(--muted)}
.mg span{border-radius:50%}
.mg .has{background:var(--acc);color:#fff;font-weight:700}
.mg .td{outline:1px solid var(--accd)}
/* month tabs on the page edge */
.tabs{position:absolute;top:6%;bottom:8%;width:1.7em;display:flex;flex-direction:column;gap:.2em;z-index:7}
.tabs.r{right:0}.tabs.l{left:0}
.tab{flex:1;min-height:0;border:0;padding:0;font-size:.58em;font-weight:600;color:hsl(var(--mh) 55% var(--tab-ink-l));display:grid;place-items:center;
  background:hsl(var(--mh) 85% var(--tab-l));transition:transform .2s}
.tabs.r .tab{border-radius:.8em 0 0 .8em}.tabs.l .tab{border-radius:0 .8em .8em 0}
.tabs.r .tab:hover,.tabs.r .tab.on{transform:translateX(-.4em)}
.tabs.l .tab:hover,.tabs.l .tab.on{transform:translateX(.4em)}
.tab.on{background:hsl(var(--mh) 72% 58%);color:#fff}
/* GoodNotes-style toolbar and page sidebar */
.scene{inset:64px 0 0 0}
.edge{position:fixed;top:50%;transform:translateY(-50%);z-index:30;width:44px;height:44px;border-radius:50%;border:0;font-size:30px;line-height:40px;padding:0 0 3px;cursor:pointer;color:var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.edge.L{left:8px}.edge.R{right:8px}.edge:disabled{opacity:.25;cursor:default}
.book{touch-action:none}
.top{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:2px;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--line);border-radius:16px;padding:5px 8px;width:max-content;max-width:calc(100% - 24px);overflow-x:auto;
  box-shadow:0 8px 30px rgba(0,0,0,.12);scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.tg{display:flex;align-items:center;flex:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.ib{width:36px;height:36px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none;padding:0}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--fill)}
.ib[aria-pressed=true]{background:rgba(0,122,255,.16);color:var(--blue)}
.ib:disabled{opacity:.3;pointer-events:none}
.sw{width:22px;height:22px;border-radius:50%;border:0;padding:0;flex:none;margin:0 3px}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--glass),0 0 0 4px var(--blue)}
.sz{width:30px;height:30px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;flex:none;padding:0}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed=true]{background:var(--fill)}
.where{min-width:96px;max-width:150px;text-align:center;font-weight:600;font-size:.85rem;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.pill,.tb{border:0;background:var(--fill);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.8rem;color:var(--ink);text-decoration:none;display:inline-block;flex:none;font-family:var(--f-body)}
.tb[aria-pressed=true]{background:var(--blue);color:#fff}
.tb[disabled]{opacity:.4}
.side{position:fixed;top:68px;left:10px;bottom:10px;width:190px;z-index:45;display:flex;flex-direction:column;gap:4px;padding:10px;overflow:auto;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.16);
  visibility:hidden;transform:translateX(-115%);transition:transform .35s cubic-bezier(.3,.8,.3,1),visibility 0s .35s}
.side.open{visibility:visible;transform:none;transition:transform .35s cubic-bezier(.3,.8,.3,1)}
.sd{display:flex;flex-direction:column;gap:6px;align-items:center;border:0;background:transparent;padding:8px;border-radius:12px;font-size:.75rem;font-weight:600;color:var(--muted);flex:none}
.sd.on{background:rgba(0,122,255,.14);color:var(--blue)}
.th{width:100%;aspect-ratio:.74;border-radius:6px;position:relative;overflow:hidden;border:.5px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.14);
  background:hsl(var(--h) var(--pg-s) var(--pg-l))}
.th::before{content:'';position:absolute;left:0;right:0;top:0;height:18%;background:hsl(var(--h) 70% 74%)}
.th::after{content:'';position:absolute;inset:32% 12% 12%;background:repeating-linear-gradient(transparent 0 7px,var(--line) 7px 8px)}
@media (max-width:640px){.where{display:none}}
/* dialogs: iOS sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.backdrop[hidden]{display:none}
.sheet{--acc:var(--blue);--acc-soft:var(--fill);--accd:var(--blue);
  background:var(--sheet);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:.5px solid var(--line);border-radius:22px;padding:22px;
  width:min(420px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.28);font-size:16px}
.sheet h3{margin:0;font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.sheet .lbl{font-size:.72rem}
.sheet .cl-add input{font-size:.95rem}
.stk-row{display:flex;gap:6px;flex-wrap:wrap}
.stk-row button{width:40px;height:40px;border-radius:12px;border:0;background:var(--fill);font-size:1.3rem;padding:0}
.stk-row button[aria-pressed=true]{box-shadow:0 0 0 2px var(--blue)}
.done-btn{align-self:flex-end;border:0;background:var(--blue);color:#fff;font-weight:600;border-radius:999px;padding:10px 24px}
.cal-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.9rem;align-items:center}
.keys kbd{font-family:var(--f-body);font-weight:600;background:var(--fill);border-radius:6px;padding:2px 8px;justify-self:start;white-space:nowrap}
.note{margin:0;color:var(--muted);font-size:.85rem;line-height:1.45}
.sheet label.opt{display:flex;gap:8px;align-items:center;font-weight:600}
.sheet label.opt input{width:20px;height:20px;accent-color:var(--blue)}
/* pastel colour by month, paper stays cream */
.cal-top{background:hsl(var(--h,335) 90% 85%);border-bottom:0;border-radius:.9em;padding:.55em .8em;margin-bottom:.2em}
.cal-top .yr{color:hsl(var(--h,335) 45% 32%)}
.cal-grid{background:hsl(var(--h,335) 70% 82%);border-color:hsl(var(--h,335) 70% 82%)}
.dc{background:hsl(var(--h,335) 100% 98%)}
.dc.blank{background:hsl(var(--h,335) 80% 90%)}
.dc:nth-child(7n),.dc:nth-child(7n+6){background:hsl(var(--h,335) 95% 94%)}
.ttl{color:hsl(var(--h,335) 50% 28%)}
.cl-plus{background:hsl(var(--h,335) 75% 70%)}
li.done .ck{background:hsl(var(--h,335) 75% 70%);border-color:hsl(var(--h,335) 75% 70%)}

/* ===== greige / linen aesthetic (inspired by a minimalist neurodivergent-friendly digital planner) ===== */
:root{
  --desk:linear-gradient(160deg,#dcd2c8,#c3b6aa);
  --ink:#4a3f3a;--muted:#8a7d75;--faint:#b9aea6;--line:rgba(90,70,60,.2);--fill:rgba(120,100,90,.12);
  --glass:rgba(250,246,240,.78);--sheet:rgba(250,246,240,.96);--blue:#8a6f62;
  --pg-s:38%;--pg-l:97%;
  --f-title:"Cormorant Garamond",ui-serif,"New York",Georgia,serif;
  --cv-bg:#e9e3d9;--cv-ink:#6b5b52;
}
:root[data-cover="pink"]{--cv-bg:#ead6d3;--cv-ink:#7a5a58}
:root[data-cover="sage"]{--cv-bg:#cfd6c4;--cv-ink:#56634f}
:root[data-cover="taupe"]{--cv-bg:#b8a89b;--cv-ink:#f7f1ea}
:root[data-cover="burgundy"]{--cv-bg:#6e3a43;--cv-ink:#f3e6e3}
:root[data-cover="charcoal"]{--cv-bg:#3d3b3b;--cv-ink:#efe9e2}
.page.cover{color:var(--cv-ink);
  background:
   linear-gradient(to right,transparent 86%,rgba(0,0,0,.07) 86%,rgba(0,0,0,.07) 91%,transparent 91%),
   repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px),
   repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px),
   var(--cv-bg)}
.cv-top{color:var(--cv-ink);opacity:.8;font-family:var(--f-title);font-weight:500;letter-spacing:.42em}
.cv-year{font-family:var(--f-title);font-weight:400;letter-spacing:.04em;color:var(--cv-ink);font-size:6em}
.cv-tip{color:var(--cv-ink);opacity:.65;font-family:var(--f-title);letter-spacing:.12em}
.ttl{font-family:var(--f-title);font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:#5a4a42;font-size:1.7em}
.cal-top{background:transparent;border-radius:0;padding:.3em 0 .6em;border-bottom:1px solid hsl(var(--h,30) 18% 62%)}
.cal-top .ttl{font-size:2em}
.cal-top .yr{color:#8a7d75;font-family:var(--f-title);letter-spacing:.2em}
.cal-grid{background:hsl(var(--h,30) 14% 78%);border:1px solid hsl(var(--h,30) 14% 78%);border-radius:.3em}
.dc{background:hsl(36 38% 98%)}
.dc.blank{background:hsl(var(--h,30) 14% 92%)}
.dc:hover{background:hsl(var(--h,30) 28% 90%)}
.cl-plus,li.done .ck{background:hsl(var(--h,30) 26% 62%);border-color:hsl(var(--h,30) 26% 62%)}
.page{--acc:hsl(var(--h,30) 26% 58%);--acc-soft:hsl(var(--h,30) 28% 90%);--accd:hsl(var(--h,30) 25% 38%)}
.dc.today .dn{background:hsl(var(--h,30) 26% 52%);color:#fff}
.tab{background:hsl(var(--mh) 22% 85%);color:hsl(var(--mh) 25% 30%);font-family:var(--f-title);font-weight:600;font-size:.64em;letter-spacing:.08em}
.tab.on{background:hsl(var(--mh) 28% 62%);color:#fff}
.lbl,.hint{letter-spacing:.14em}

/* ===== book v3: quarters, weeks, daily pages, extras, section tabs, cover designer ===== */
.dc.we{background:hsl(var(--h,30) 24% 95%)}
.stabs{position:absolute;top:0;left:1.9em;right:1.9em;display:flex;justify-content:center;gap:.25em;z-index:7}
.stab{border:0;padding:.28em .75em .34em;font-family:var(--f-title);font-size:.7em;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border-radius:0 0 .7em .7em;background:hsl(30 14% 87%);color:#6b5b52}
.stab.on{background:hsl(30 16% 60%);color:#fff}

  var now=new Date(), todayIso=iso(now.getFullYear(),now.getMonth(),now.getDate());

  function openDb(){return new Promise(function(res,rej){try{var r=indexedDB.open(DBN,1);r.onupgradeneeded=function(){r.result.createObjectStore(DBS)};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}

  function idbGet(k){return getDb().then(function(db){return new Promise(function(res,rej){var q=db.transaction(DBS,'readonly').objectStore(DBS).get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
  function idbPut(k,v){return getDb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(DBS,'readwrite');tx.objectStore(DBS).put(v,k);tx.oncomplete=function(){res()};tx.onerror=tx.onabort=function(){rej(tx.error)}})})}
  async function readSaved(){

  var ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[b.getAttribute('data-icon')]+'</svg>';
  });
  function buildColors(){
    var box=$('colors');box.innerHTML='';
    COLORS.forEach(function(c,i){
      var b=el('button','sw');b.type='button';b.style.background=c;b.setAttribute('aria-label','Colour '+(i+1));b.setAttribute('aria-pressed',color===c);
      b.onclick=function(){color=c;if(!drawOn||tool==='eraser')setTool(penTool);buildColors()};box.appendChild(b);
    });
  }
  function buildSizes(){
    var box=$('sizes');box.innerHTML='';
    [3,6,10].forEach(function(px,i){
      var b=el('button','sz');b.type='button';b.setAttribute('aria-label',['Thin','Medium','Thick'][i]+' line');b.setAttribute('aria-pressed',sizeI===i);
      var d=el('i');d.style.width=d.style.height=px+'px';b.appendChild(d);
      b.onclick=function(){sizeI=i;buildSizes()};box.appendChild(b);
    });
  }
  function setTool(t){
    tool=t;drawOn=t!=='hand';if(t==='pen'||t==='hl')penTool=t;
    book.classList.toggle('drawing',drawOn);
    ['hand','pen','hl','eraser'].forEach(function(n){$('t-'+n).setAttribute('aria-pressed',tool===n)});
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-tool]'),function(b){
    b.onclick=function(){setTool(b.getAttribute('data-tool'))};
  });
  $('undo').onclick=undo;$('redo').onclick=redo;
  function visiblePages(){
    var i=curPage();
    if(pf.getOrientation()==='portrait'||i===0||i>=N-1)return [i];
    return [i,i+1];
  }
  function clearSpread(){
    var items=visiblePages().filter(function(pi){return strokesOf(pi).length}).map(function(pi){return {pi:pi,arr:strokesOf(pi)}});
    if(!items.length)return;
    items.forEach(function(it){state.ink[it.pi]=[];inkDraw(it.pi)});
    hist.push({t:'clr',items:items});redoStack=[];save();syncUndo();
  }

  /* page sidebar, like the page list in GoodNotes */
  function buildSide(){
    var box=$('side');box.innerHTML='';
    PAGES.forEach(function(pg,i){
      if(!pg.sd)return;
      var b=el('button','sd');b.type='button';b.setAttribute('data-p',i);b.style.setProperty('--h',pg.h);
      b.appendChild(el('span','th'));b.appendChild(el('span',null,pg.sd));
      b.onclick=function(){goToPage(i)};box.appendChild(b);
    });
  }
  function markSide(){
    var p=curPage(),best=null;
    Array.prototype.forEach.call($('side').children,function(b){var n=+b.getAttribute('data-p');b.classList.remove('on');if(n<=p)best=b});
    if(best){best.classList.add('on');if($('side').classList.contains('open'))best.scrollIntoView({block:'nearest'})}
  }
  function toggleSide(){
    var open=!$('side').classList.contains('open');
    $('side').classList.toggle('open',open);$('sidebtn').setAttribute('aria-pressed',open);markSide();
  }
  $('sidebtn').onclick=toggleSide;

  /* ---------- calendar links and export ---------- */
  var dlCap=null;
  try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(function(d){dlCap=d}).catch(function(){})}catch(x){}
  function enc(v){return encodeURIComponent(v)}
  function ymd(k){return k.replace(/-/g,'')}
  function nextDay(k){var a=k.split('-'),d=new Date(+a[0],+a[1]-1,+a[2]+1);return iso(d.getFullYear(),d.getMonth(),d.getDate())}
  function gcalUrl(title,k,details){
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+enc(title)+'&dates='+ymd(k)+'/'+ymd(nextDay(k))+'&details='+enc(details);
  }
  function outlookUrl(title,k,details){
    return 'https://outlook.live.com/calendar/0/deeplink/compose?path='+enc('/calendar/action/compose')+'&rru=addevent&allday=true&subject='+enc(title)+'&startdt='+k+'&enddt='+k+'&body='+enc(details);
  }
  function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
  function fold(l){var o=[];while(l.length>74){o.push(l.slice(0,74));l=' '+l.slice(74)}o.push(l);return o.join('\r\n')}
  function icsText(items){
    var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    var out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Petal Planner//EN','CALSCALE:GREGORIAN'];
    items.forEach(function(it){
      out.push('BEGIN:VEVENT','UID:'+it.id+'-'+ymd(it.k)+'@petal-planner','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+ymd(it.k),'DTEND;VALUE=DATE:'+ymd(nextDay(it.k)),'SUMMARY:'+icsEsc(it.text),'END:VEVENT');
    });
    out.push('END:VCALENDAR');
    return out.map(fold).join('\r\n')+'\r\n';
  }
  function q(v){return '"'+String(v).replace(/"/g,'""')+'"'}
  function csvText(items){
    var rows=['Subject,Start Date,End Date,All Day Event,Description'];
    items.forEach(function(it){var a=it.k.split('-'),d=a[1]+'/'+a[2]+'/'+a[0];rows.push([q(it.text),d,d,'True',q('Petal Planner')].join(','))});
    return rows.join('\r\n')+'\r\n';
  }
  var msgEl=null;
  function setMsg(t){if(msgEl)msgEl.textContent=t}
  function saveText(filename,text,realName){
    if(dlCap){
      dlCap.save({filename:filename,data:text}).then(function(){setMsg('Saved.')}).catch(function(err){
        setMsg(err&&err.code==='declined'?'Save cancelled.':'Saving is not available here.');
      });return;
    }
    try{
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
      a.download=realName||filename;document.body.appendChild(a);a.click();a.remove();setMsg('Downloaded.');
    }catch(x){setMsg('Saving is not available here.')}
  }
  function collect(prefix){
    var out=[];Object.keys(state.days).sort().forEach(function(k){
      if(k.indexOf(prefix)!==0)return;
      state.days[k].tasks.forEach(function(t){if(!t.done)out.push({k:k,text:t.text,id:t.id})});
    });return out;
  }
  var sheet=$('sheet');
  function showDialog(){$('backdrop').hidden=false}
  function openCal(){
    sheet.innerHTML='';
    var p=curPage(),m=(p>=5&&p<=28)?Math.floor((p-5)/2):now.getMonth(),y=state.year;
    var mon=collect(y+'-'+pad(m+1)),yr=collect(String(y));
    sheet.appendChild(el('h3',null,'Calendar'));
    sheet.appendChild(el('p','note','Open to-dos become all-day events. Pick a day in the book to add one day to Google or Outlook with a link.'));
    function row(label,fn){
      sheet.appendChild(el('span','lbl',label));
      var r=el('div','cal-row');
      [[MONTHS[m]+' ('+mon.length+')',mon,'-'+pad(m+1)],['Whole '+y+' ('+yr.length+')',yr,'']].forEach(function(o){
        var b=el('button','tb',o[0]);b.type='button';b.disabled=!o[1].length;
        b.onclick=function(){fn(o[1],'petal-'+y+o[2])};r.appendChild(b);
      });sheet.appendChild(r);
    }
    row(dlCap?'Apple Calendar (.ics.txt, rename to .ics)':'Apple Calendar (.ics)',function(items,name){saveText(name+'.ics.txt',icsText(items),name+'.ics')});
    row('Google or Outlook import (.csv)',function(items,name){saveText(name+'.csv',csvText(items))});
    sheet.appendChild(el('span','lbl','Open your calendar'));
    var lr=el('div','cal-row');
    [['Google','https://calendar.google.com/'],['Outlook','https://outlook.live.com/calendar/'],['iCloud','https://www.icloud.com/calendar/']].forEach(function(l){
      var a=el('a','tb',l[0]);a.href=l[1];a.target='_blank';a.rel='noopener noreferrer';lr.appendChild(a);
    });sheet.appendChild(lr);
    msgEl=el('p','note','');sheet.appendChild(msgEl);
    sheet.appendChild(el('p','note','Links and files add events one way. Changes you make in your calendar do not come back into the book.'));
    var done=el('button','done-btn','Done');done.type='button';done.onclick=closeSheet;sheet.appendChild(done);
    showDialog();
  }
  $('calbtn').onclick=openCal;

  /* ---------- shortcuts help ---------- */
  var KEYS=[['← →','Flip pages'],['Home / End','Cover / back cover'],['V','Hand: tap and flip'],['P  H  E','Pen, highlighter, eraser'],['1 – 6','Pick a colour'],['[  ]','Thinner / thicker line'],['Z  ⇧Z','Undo / redo'],['S','Page sidebar'],['T','Jump to this month'],['G','Year at a glance'],['N','Plan today'],['C','Calendar links and export'],['Esc','Back to the hand tool'],['?','Show this list']];
  function openHelp(){
    sheet.innerHTML='';msgEl=null;
    sheet.appendChild(el('h3',null,'Shortcuts'));
    var g=el('div','keys');KEYS.forEach(function(r){g.append(el('kbd',null,r[0]),el('span',null,r[1]))});sheet.appendChild(g);
    var lab=el('label','opt'),cb=el('input');cb.type='checkbox';cb.id='sc-toggle';cb.checked=!!state.prefs.shortcuts;
    cb.onchange=function(){state.prefs.shortcuts=cb.checked;save()};
    lab.append(cb,el('span',null,'Keyboard shortcuts on'));sheet.appendChild(lab);
    sheet.appendChild(el('p','note','Apple Pencil always writes, anywhere on a page. Your finger taps days and turns pages by their corner. With the pen, highlighter or eraser selected, a mouse draws too. Apple Scribble works in text boxes.'));
    var done=el('button','done-btn','Done');done.type='button';done.onclick=closeSheet;sheet.appendChild(done);
    showDialog();
  }
  $('helpbtn').onclick=openHelp;
  $('coverbtn').onclick=openCover;$('coverbtn').title='Cover and settings';applyCover();
  (function(){
    var dark=false;try{dark=localStorage.getItem('pp-theme')==='dark'}catch(x){}
    function ap(){document.documentElement.setAttribute('data-theme',dark?'dark':'light');$('themebtn').innerHTML=dark?'&#9788;':'&#9790;';$('themebtn').setAttribute('aria-pressed',dark)}
    $('themebtn').onclick=function(){dark=!dark;try{localStorage.setItem('pp-theme',dark?'dark':'light')}catch(x){}ap()};
    ap();
  })();

  /* ---------- day sheet ---------- */
  function openSheet(k){
    var dd=getDay(k),a=k.split('-'),dt=new Date(+a[0],+a[1]-1,+a[2]);
    sheet.innerHTML='';msgEl=null;
    var h=el('h3',null,dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}));h.id='sheet-title';
    sheet.appendChild(h);
    sheet.appendChild(el('span','lbl','Sticker'));
    var row=el('div','stk-row');
    function drawStk(){row.innerHTML='';STICKERS.forEach(function(s2){
      var b=el('button',null,s2);b.type='button';b.setAttribute('aria-pressed',dd.sticker===s2);b.setAttribute('aria-label','Sticker '+s2);
      b.onclick=function(){dd.sticker=dd.sticker===s2?'':s2;save();drawStk();refreshData()};row.appendChild(b)})}
    drawStk();sheet.appendChild(row);
    sheet.appendChild(el('span','lbl','To-dos'));
    var gLink=function(t){
      var a2=el('a','cal','📅');a2.href=gcalUrl(t.text,k,'From Petal Planner');a2.target='_blank';a2.rel='noopener noreferrer';
      a2.title='Add to Google Calendar';a2.setAttribute('aria-label','Add '+t.text+' to Google Calendar');return a2;
    };
    var ga=el('a','tb','Google'),oa=el('a','tb','Outlook'),ib=el('button','tb',dlCap?'Apple (.ics.txt)':'Apple (.ics)');
    function updCal(){
      var n=dd.tasks.length,title=n===1?dd.tasks[0].text:'Planner day'+(n?' ('+n+' to-dos)':'');
      var det=dd.tasks.map(function(t){return '• '+t.text}).join('\n')||'From Petal Planner';
      ga.href=gcalUrl(title,k,det);oa.href=outlookUrl(title,k,det);
    }
    sheet.appendChild(checklist(dd.tasks,'Add a to-do...',function(){refreshData();updCal()},gLink));
    sheet.appendChild(el('span','lbl','Add the whole day to a calendar'));
    var cr=el('div','cal-row');
    [ga,oa].forEach(function(x){x.target='_blank';x.rel='noopener noreferrer'});
    ib.type='button';
    ib.onclick=function(){
      var items=dd.tasks.map(function(t){return {k:k,text:t.text,id:t.id}});
      if(!items.length)items=[{k:k,text:'Planner day',id:'day'+k}];
      saveText('petal-'+k+'.ics.txt',icsText(items),'petal-'+k+'.ics');
    };
    cr.append(ga,oa,ib);sheet.appendChild(cr);updCal();
    msgEl=el('p','note','');sheet.appendChild(msgEl);
    var done=el('button','done-btn','Done');done.type='button';done.onclick=closeSheet;sheet.appendChild(done);
    showDialog();
    var inp=sheet.querySelector('input');if(inp)inp.focus();
  }
  function closeSheet(){$('backdrop').hidden=true;refreshData()}
  $('backdrop').addEventListener('click',function(e){if(e.target===this)closeSheet()});

  /* ---------- toolbar wiring and keys ---------- */
  $('prev').onclick=function(){turn(-1)};
  $('next').onclick=function(){turn(1)};
  $('edgeR').onclick=function(){turn(1)};$('edgeL').onclick=function(){turn(-1)};
  $('today').onclick=function(){openDay(todayIso)};
  document.addEventListener('keydown',function(e){
    var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
    var k=e.key;
    if(!$('backdrop').hidden){if(k==='Escape')closeSheet();return}
    if(k==='ArrowRight'){turn(1);return}
    if(k==='ArrowLeft'){turn(-1);return}
    if(!state.prefs.shortcuts||e.altKey)return;
    if(e.ctrlKey||e.metaKey){if(k.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo()}return}
    var lk=k.toLowerCase(),used=true;
    if(lk==='v')setTool('hand');
    else if(lk==='p')setTool('pen');
    else if(lk==='h')setTool('hl');
    else if(lk==='e')setTool('eraser');
    else if(lk==='z'){if(e.shiftKey)redo();else undo()}
    else if(/^[1-6]$/.test(k)){color=COLORS[+k-1];if(!drawOn||tool==='eraser')setTool(penTool);buildColors()}
    else if(k==='['){sizeI=Math.max(0,sizeI-1);buildSizes()}
    else if(k===']'){sizeI=Math.min(2,sizeI+1);buildSizes()}
    else if(lk==='s')toggleSide();
    else if(lk==='t')openDay(todayIso);
    else if(lk==='g')goToPage(IDX.yearcal);
    else if(lk==='n')openSheet(todayIso);
    else if(lk==='c')openCal();
    else if(k==='?'||k==='/')openHelp();
    else if(k==='Home')goToPage(0);
    else if(k==='End')goToPage(N-1);
    else if(k==='Escape')setTool('hand');
    else used=false;
    if(used)e.preventDefault();
  });
  buildColors();buildSizes();buildSide();setTool('hand');syncUndo();
  start();
})();
</script>
<script>
/* offline support: only when the planner runs as its own site, not inside a preview frame */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.self===window.top){
  var regSW=function(){navigator.serviceWorker.register('sw.js').catch(function(){})};
  if(document.readyState==='complete')regSW();else window.addEventListener('load',regSW);
}
</script>
